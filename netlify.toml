# Netlify — Foodprint mobile web (PWA)
#
# OPTION A — Manual deploy (upload dist/):
#   1. Copy .env.example → .env and fill in keys
#   2. npm run build:netlify
#   3. Netlify → Sites → Deploy manually → drag the dist/ folder
#
# OPTION B — Git deploy (recommended):
#   Connect this repo; Netlify runs build:netlify and publishes dist/
#   Set EXPO_PUBLIC_* vars in Site configuration → Environment variables
#   Set EXPO_PUBLIC_APP_URL to your site URL (e.g. https://foodprint-pro.netlify.app)
#
# After deploy, add your Netlify URL to:
#   Supabase → Auth → URL Configuration → Redirect URLs
#   Google Cloud → OAuth client → Authorized JavaScript origins + redirect URIs
#   Deploy Supabase edge functions: create-checkout, verify-checkout, stripe-checkout

[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  EXPO_PUBLIC_APP_URL = "https://foodprint-pro.netlify.app"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/build-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/build-version.json"
  to = "/build-version.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
