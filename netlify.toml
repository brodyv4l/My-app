# Netlify — legacy redirect to Vercel (production is GitHub → Vercel)
#
# Live app: https://foodprint-pro.vercel.app
# Push to main on GitHub; Vercel builds automatically (see vercel.json).
# Run `npm run setup:vercel` once so Vercel has EXPO_PUBLIC_* build env vars.
#
# After deploy, add your Netlify URL to:
#   Supabase → Auth → URL Configuration → Redirect URLs
#   Google Cloud → OAuth client → Authorized JavaScript origins + redirect URIs
#   Deploy Supabase edge functions: create-checkout, verify-checkout, stripe-checkout

[build]
  command = "echo Netlify is deprecated — use Vercel"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/build-version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/build-version.json"
  to = "/build-version.json"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://foodprint-pro.vercel.app/:splat"
  status = 301
  force = true
